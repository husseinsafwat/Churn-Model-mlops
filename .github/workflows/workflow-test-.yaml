name: CI/CD Pipeline

on: 
  push: 
    branches: 
      - Deployment

jobs: 
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Tests
        run: pytest tests/test_api.py
        
  build-and-push:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build, tag, and push image to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          REGISTRY_REPOSITORY: customer_churn_app
          IMAGE_TAG: latest
        run: |
          docker build -t $DOCKER_USER/$REGISTRY_REPOSITORY:$IMAGE_TAG .
          docker push $DOCKER_USER/$REGISTRY_REPOSITORY:$IMAGE_TAG
          
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH into EC2 and Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker stop hussein-churn-app || true
            docker rm hussein-churn-app || true
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/customer_churn_app:latest
            docker run -d --name hussein-churn-app -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/customer_churn_app:latest